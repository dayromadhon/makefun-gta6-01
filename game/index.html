<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLMAR HEAT — Solmar Bay</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0e12; font-family: 'Segoe UI', Arial, sans-serif; }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; z-index: 5; }
  #hud-top { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 18px; align-items: center; }
  #hud-stars { font-size: 26px; letter-spacing: 4px; color: #ffd21f; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
  #hud-cash { display: flex; flex-direction: column; align-items: flex-end; background: rgba(10,14,18,.55); padding: 6px 12px; border-radius: 8px; }
  #hud-cash-v { font-size: 22px; font-weight: 700; color: #7ad97a; }
  #hud-debt-v { font-size: 13px; color: #ff9a8a; }
  #hud-health { position: absolute; left: 14px; bottom: 14px; width: 220px; height: 18px; background: rgba(10,14,18,.6); border-radius: 9px; overflow: hidden; }
  #hud-health-fill { height: 100%; width: 100%; background: #4fc25a; transition: width .2s; }
  #hud-health-v { position: absolute; right: 8px; top: 0; line-height: 18px; font-size: 12px; font-weight: 700; }
  #hud-speed { position: absolute; right: 14px; bottom: 14px; text-align: right; background: rgba(10,14,18,.55); padding: 6px 12px; border-radius: 8px; }
  #hud-speed-v { font-size: 30px; font-weight: 800; }
  #hud-speed .unit { font-size: 13px; color: #bbb; margin-left: 4px; }
  #hud-ammo-v { display: block; font-size: 13px; color: #ffd21f; }
  #hud-mission { position: absolute; left: 14px; top: 12px; max-width: 320px; background: rgba(10,14,18,.6); padding: 10px 12px; border-radius: 8px; border-left: 4px solid #ffd21f; }
  #hud-mission-title { font-size: 15px; font-weight: 700; }
  #hud-mission-obj { font-size: 13px; color: #ddd; margin-top: 2px; }
  #hud-mission-timer { font-size: 14px; color: #ffd21f; font-weight: 700; margin-top: 2px; }
  #hud-minimap { position: absolute; right: 14px; top: 12px; border: 2px solid rgba(255,255,255,.35); border-radius: 8px; background: rgba(10,14,18,.6); }
  #hud-toast { position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%); background: rgba(10,14,18,.75); padding: 8px 16px; border-radius: 8px; font-size: 15px; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  #hud-prompt { position: absolute; left: 50%; bottom: 54px; transform: translateX(-50%); font-size: 14px; color: #ffe9a8; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
  #hud-menu { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(6,10,14,.72); pointer-events: auto; text-align: center; padding: 20px; }
  #hud-menu.hidden { display: none; }
  #hud-menu-title { font-size: 52px; font-weight: 900; letter-spacing: 6px; color: #ffd21f; text-shadow: 0 4px 18px rgba(0,0,0,.8); }
  #hud-menu-sub { font-size: 16px; color: #cfe3f2; margin-top: 2px; }
  #hud-menu-body { max-width: 560px; font-size: 15px; line-height: 1.55; color: #e8e8e8; margin-top: 14px; }
  #hud-menu-btns { display: flex; gap: 12px; margin-top: 20px; }
  .hud-btn { pointer-events: auto; cursor: pointer; font-size: 17px; font-weight: 700; color: #111; background: #ffd21f; border: none; border-radius: 8px; padding: 12px 22px; }
  .hud-btn:hover { background: #ffe066; }
  #hud-menu-hint { margin-top: 22px; font-size: 12px; color: #9aa8b5; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.min.js" } }
</script>
</head>
<body>
<div id="game"></div>
<div id="hud"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
