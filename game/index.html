<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLMAR HEAT — Make GTA 6</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1a24; font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
  #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #hud button { pointer-events: auto; }

  .hud-tl { position: absolute; top: 14px; left: 16px; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  .cash { font-size: 30px; font-weight: 800; color: #7dff9a; }
  .debt { font-size: 14px; color: #ffb3b3; margin-top: 2px; }
  .health-wrap { width: 180px; height: 10px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.4); border-radius: 5px; margin-top: 8px; overflow: hidden; }
  .health-bar { height: 100%; width: 100%; background: #2ecc71; transition: width .2s; }
  .health-text { font-size: 13px; margin-top: 3px; }

  .hud-tr { position: absolute; top: 14px; right: 16px; text-align: right; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  .stars { font-size: 26px; letter-spacing: 3px; }
  .ammo { font-size: 14px; margin-top: 4px; color: #ffe9a8; }

  .hud-tc { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: min(520px, 60vw); text-align: center; background: rgba(8, 18, 28, .62); border: 1px solid rgba(255,200,55,.5); border-radius: 10px; padding: 8px 14px; text-shadow: 0 1px 2px rgba(0,0,0,.8); }
  .mission-title { font-size: 17px; font-weight: 700; color: #ffc837; }
  .mission-brief { font-size: 13px; margin-top: 2px; color: #e8e8e8; }
  .mission-target { font-size: 13px; margin-top: 2px; color: #9fd8ff; }
  .mission-timer { font-size: 15px; font-weight: 700; color: #ff8a7a; margin-top: 2px; }

  .hud-bl { position: absolute; left: 16px; bottom: 16px; }
  .minimap { border: 2px solid rgba(255,255,255,.5); border-radius: 8px; background: rgba(10,20,30,.75); }

  .hud-br { position: absolute; right: 16px; bottom: 16px; text-align: right; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  .speed { font-size: 26px; font-weight: 800; }
  .hint { font-size: 11px; color: rgba(255,255,255,.65); margin-top: 4px; max-width: 320px; }

  .toast { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%); background: rgba(8,18,28,.85); border: 1px solid rgba(255,255,255,.35); border-radius: 8px; padding: 10px 18px; font-size: 15px; opacity: 0; transition: opacity .3s; max-width: 70vw; text-align: center; }

  .screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: rgba(5, 12, 20, .62); z-index: 10; padding: 20px; }
  .screen-title { font-size: 54px; font-weight: 900; letter-spacing: 4px; color: #ffc837; margin: 0 0 12px; text-shadow: 0 3px 0 #7a4a00, 0 6px 18px rgba(0,0,0,.7); }
  .screen-body { font-size: 17px; line-height: 1.6; max-width: 620px; color: #f0f0f0; }
  .screen-body .keys { font-size: 14px; color: #bcd8ff; }
  .screen-btn { margin-top: 22px; font-size: 19px; font-weight: 700; padding: 13px 34px; border: none; border-radius: 10px; background: #ffc837; color: #201400; cursor: pointer; box-shadow: 0 4px 0 #a67c00; }
  .screen-btn:hover { background: #ffd95e; }
  .screen-btn.secondary { background: #2e6da4; color: #fff; box-shadow: 0 4px 0 #1a4066; margin-left: 10px; }
  .screen-btn.secondary:hover { background: #3a84c4; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.min.js"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="hud"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
